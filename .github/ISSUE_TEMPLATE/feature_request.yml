name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - "Web app"
        - "Mobile app (Expo / Android)"
        - "Online play"
        - "Game rules / AI (engine)"
        - "Design / theme"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the motivation. "I'm frustrated when…" / "It would be great if…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about.
    validations:
      required: false
