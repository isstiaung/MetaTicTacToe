name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please search existing issues first to avoid duplicates.
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - "Web app"
        - "Mobile app (Expo / Android)"
        - "Online play (rooms / reconnect)"
        - "Game rules / AI (engine)"
        - "Game server (party)"
        - "Build / tooling / docs"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? Board positions / move sequences are very helpful for rules bugs.
      placeholder: |
        1. Go to '...'
        2. Make move '...'
        3. See '...'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS, or device + Android version. Local dev or the hosted app?
      placeholder: "e.g. Chrome 126 / macOS 14, or Pixel 7 / Android 14 — hosted at mttt.isstiaung.me"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console / logs (optional)
      description: Any relevant console output or error messages.
      render: shell
    validations:
      required: false
