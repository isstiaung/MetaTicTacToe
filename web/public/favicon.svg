<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ultimate Tic-Tac-Toe">
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
  <!-- claimed-cell glow (the app's signature active-board highlight) -->
  <rect x="11" y="11" width="14" height="14" rx="2.5" fill="#ECEDFB"/>
  <!-- 3x3 grid -->
  <g stroke="#CFD4DC" stroke-width="3.2" stroke-linecap="round">
    <line x1="25" y1="11" x2="25" y2="53"/>
    <line x1="39" y1="11" x2="39" y2="53"/>
    <line x1="11" y1="25" x2="53" y2="25"/>
    <line x1="11" y1="39" x2="53" y2="39"/>
  </g>
  <!-- X (indigo) -->
  <g stroke="#4F46E5" stroke-width="3.8" stroke-linecap="round">
    <line x1="14.6" y1="14.6" x2="21.4" y2="21.4"/>
    <line x1="21.4" y1="14.6" x2="14.6" y2="21.4"/>
  </g>
  <!-- O (emerald) -->
  <circle cx="46" cy="46" r="5" fill="none" stroke="#0E9F6E" stroke-width="3.8"/>
</svg>
